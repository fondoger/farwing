name: Windows ARM64 release

on:
  push:
    branches: [ci/windows-arm64-release]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional new release tag (leave empty to build artifacts only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and verify native Windows ARM64 EXE
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Verify native ARM64 toolchain
        run: |
          $info = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $info -notcontains 'host: aarch64-pc-windows-msvc') {
            throw "Expected a native aarch64-pc-windows-msvc toolchain: $info"
          }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is required' }

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target/build-release
            xtask -> target

      - name: Build, check PE manifest and run startup checks
        run: |
          cargo dist --native
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 release build or verification failed' }

      - name: Verify ARM64 PE and prepare release assets
        run: |
          $files = @(Get-ChildItem target/dist/native/OpenUUYC-*-windows-aarch64.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one ARM64 executable' }
          $exe = $files[0]
          $image = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($image, 0x3c)
          if ([BitConverter]::ToUInt32($image, $pe) -ne 0x00004550 -or
              [BitConverter]::ToUInt16($image, $pe + 4) -ne 0xaa64) {
            throw 'Release executable is not an ARM64 PE image'
          }
          $source = $exe.Name -replace '-windows-aarch64\.exe$', '-source.zip'
          git archive --format=zip "--output=target/dist/native/$source" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed' }
          Get-ChildItem target/dist/native -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content target/dist/native/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-release
          path: target/dist/native/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Actions summary
        run: |
          @'
          ## Windows ARM64 build
          Native `aarch64-pc-windows-msvc` single-file EXE, built on `windows-11-arm`.
          PE architecture, embedded application manifest and `--version` startup checks passed.
          The native EXE includes the application's existing install/update commands.
          The bundled virtual drivers are x64-only; ARM64 driver support is not provided.
          '@ >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish Windows ARM64 assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-arm64-release
          path: release

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          Native Windows ARM64 build of OpenUUYC, built and verified in GitHub Actions.

          Download the `windows-aarch64.exe` asset and run it on Windows ARM64.
          This single-file EXE includes the application's existing install/update commands.
          The bundled virtual input, display and audio drivers are x64-only and cannot be used on ARM64.
          This is a community ARM64 build; remote-session functionality still needs device testing.

          The source archive includes the build configuration and retained license notices.
          SHA-256 checksums are provided in `SHA256SUMS.txt`.
          NOTES
          flags=(--title "$RELEASE_TAG — Windows ARM64" --notes-file notes.md --latest=false)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*
          else
            gh release create "$RELEASE_TAG" release/* --target "$RELEASE_COMMIT" "${flags[@]}"
          fi
